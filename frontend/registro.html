<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - My Site Art</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/registro.css" rel="stylesheet">
    <link href="css/header.css" rel="stylesheet">
</head>
<body>
    <div class="registro-header">
        <a href="index.html" class="logo">
            <h2>My Site Art</h2>
            <p class="text-muted">Crear una cuenta</p>
        </a>
    </div>
    <div class="container">
        <div class="registro-container">
            <form id="registroForm">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo" required>
                </div>
                <div class="mb-3">
                    <label for="contraseña" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="contraseña" name="contraseña" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-requirements" id="passwordRequirements">
                        <ul>
                            <li id="length">Mínimo 8 caracteres</li>
                            <li id="uppercase">Al menos una mayúscula</li>
                            <li id="lowercase">Al menos una minúscula</li>
                            <li id="number">Al menos un número</li>
                        </ul>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="confirmar_contraseña" class="form-label">Confirmar contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmar_contraseña" name="confirmar_contraseña" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="tipo_usuario" class="form-label">Tipo de usuario</label>
                    <select class="form-select" id="tipo_usuario" name="tipo_usuario" required>
                        <option value="">Seleccione un tipo</option>
                        <option value="artista">Artista</option>
                        <option value="comprador">Comprador</option>
                    </select>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <div id="debugInfo"></div>
            </form>
            <div class="login-link">
                ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
