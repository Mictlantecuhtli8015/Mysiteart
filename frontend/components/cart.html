<!-- Carrito de compras -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="cartOffcanvasLabel">
            <i class="fas fa-shopping-cart me-2"></i>Carrito de Compras
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div id="cartItems">
            <!-- Los items del carrito se cargarán dinámicamente -->
            <div class="text-center py-4" id="emptyCart">
                <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
                <p class="text-muted">Tu carrito está vacío</p>
            </div>
        </div>
        <div class="cart-summary mt-3">
            <div class="d-flex justify-content-between mb-2">
                <span>Subtotal:</span>
                <span id="cartSubtotal">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span>Envío:</span>
                <span id="cartShipping">$0.00</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-3">
                <strong>Total:</strong>
                <strong id="cartTotal">$0.00</strong>
            </div>
            <button class="btn btn-primary w-100" id="checkoutButton" disabled>
                Proceder al Pago
            </button>
        </div>
    </div>
</div>
