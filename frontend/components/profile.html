<!-- Perfil de usuario -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="profileOffcanvas" aria-labelledby="profileOffcanvasLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="profileOffcanvasLabel">
            <i class="fas fa-user-circle me-2"></i>Mi Perfil
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div class="text-center mb-4">
            <div class="profile-image-container mb-3">
                <img src="img/default-avatar.jpg" alt="Foto de perfil" class="rounded-circle" style="width: 100px; height: 100px; object-fit: cover;">
                <button class="btn btn-sm btn-outline-primary position-absolute bottom-0 end-0 rounded-circle">
                    <i class="fas fa-camera"></i>
                </button>
            </div>
            <h5 class="mb-1" id="userName">Nombre del Usuario</h5>
            <p class="text-muted mb-0" id="userEmail">usuario@email.com</p>
        </div>

        <div class="list-group">
            <a href="#" class="list-group-item list-group-item-action">
                <i class="fas fa-user me-2"></i>Editar Perfil
            </a>
            <a href="#" class="list-group-item list-group-item-action">
                <i class="fas fa-shopping-bag me-2"></i>Mis Compras
            </a>
            <a href="#" class="list-group-item list-group-item-action">
                <i class="fas fa-heart me-2"></i>Favoritos
            </a>
            <a href="#" class="list-group-item list-group-item-action">
                <i class="fas fa-credit-card me-2"></i>Métodos de Pago
            </a>
            <a href="#" class="list-group-item list-group-item-action">
                <i class="fas fa-map-marker-alt me-2"></i>Direcciones
            </a>
            <a href="#" class="list-group-item list-group-item-action text-danger">
                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
            </a>
        </div>
    </div>
</div>
