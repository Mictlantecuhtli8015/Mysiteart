<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - My Site Art</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/navbar.css" rel="stylesheet">
    <link href="css/common.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
</head>
<body>
    <!-- Contenedor para la barra de navegación -->
    <div id="navbar-container"></div>

    <main class="container py-4">
        <h2 class="mb-4">Carrito de Compras</h2>
        
        <div class="row">
            <!-- Lista de productos -->
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-body">
                        <!-- Producto 1 -->
                        <div class="cart-item d-flex align-items-center mb-4">
                            <img src="img/art1.jpg" alt="Arte 1" class="img-thumbnail" style="width: 100px; height: 100px; object-fit: cover;">
                            <div class="ms-3 flex-grow-1">
                                <h5 class="mb-1">Pintura Abstracta</h5>
                                <p class="text-muted mb-1">Artista: Juan Pérez</p>
                                <div class="d-flex align-items-center">
                                    <div class="input-group" style="width: 120px;">
                                        <button class="btn btn-outline-secondary" type="button">-</button>
                                        <input type="text" class="form-control text-center" value="1">
                                        <button class="btn btn-outline-secondary" type="button">+</button>
                                    </div>
                                    <span class="ms-3">$1,200.00</span>
                                </div>
                            </div>
                            <button class="btn btn-link text-danger">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>

                        <!-- Producto 2 -->
                        <div class="cart-item d-flex align-items-center">
                            <img src="img/art2.jpg" alt="Arte 2" class="img-thumbnail" style="width: 100px; height: 100px; object-fit: cover;">
                            <div class="ms-3 flex-grow-1">
                                <h5 class="mb-1">Escultura Moderna</h5>
                                <p class="text-muted mb-1">Artista: María García</p>
                                <div class="d-flex align-items-center">
                                    <div class="input-group" style="width: 120px;">
                                        <button class="btn btn-outline-secondary" type="button">-</button>
                                        <input type="text" class="form-control text-center" value="1">
                                        <button class="btn btn-outline-secondary" type="button">+</button>
                                    </div>
                                    <span class="ms-3">$2,500.00</span>
                                </div>
                            </div>
                            <button class="btn btn-link text-danger">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Resumen del pedido -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Resumen del Pedido</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <span>$3,700.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Envío</span>
                            <span>$150.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Impuestos</span>
                            <span>$592.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <strong>Total</strong>
                            <strong>$4,442.00</strong>
                        </div>
                        <button class="btn btn-primary w-100 mb-2">Proceder al Pago</button>
                        <a href="index.html" class="btn btn-outline-secondary w-100">Seguir Comprando</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
