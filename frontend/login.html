<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - My Site Art</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/navbar.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
</head>
<body>
    <!-- Contenedor para la barra de navegación -->
    <div id="navbar-container"></div>

    <main class="container">
        <section class="login-container">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo" required>
                </div>
                <div class="mb-3">
                    <label for="contraseña" class="form-label">Contraseña</label>
                    <div class="password-container">
                        <input type="password" class="form-control" id="contraseña" name="contraseña" required>
                        <span class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <div id="debugInfo"></div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('contraseña');
            const toggleIcon = document.querySelector('.password-toggle i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const correo = document.getElementById('correo').value;
            const contraseña = document.getElementById('contraseña').value;
            const errorMessage = document.getElementById('errorMessage');
            const debugInfo = document.getElementById('debugInfo');
            
            try {
                console.log('Enviando solicitud a:', '/Mysiteart/public/login.php');
                const response = await fetch('/Mysiteart/public/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        correo: correo,
                        contraseña: contraseña
                    })
                });

                console.log('Respuesta recibida:', response);
                const data = await response.json();
                console.log('Datos recibidos:', data);
                
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errorMessage.textContent = data.message;
                    errorMessage.style.display = 'block';
                    
                    // Mostrar información de depuración
                    debugInfo.innerHTML = `
                        <strong>Información de depuración:</strong><br>
                        <pre>${JSON.stringify(data.debug, null, 2)}</pre>
                    `;
                    debugInfo.style.display = 'block';
                }
            } catch (error) {
                console.error('Error completo:', error);
                errorMessage.textContent = 'Error al conectar con el servidor';
                errorMessage.style.display = 'block';
                
                // Mostrar información de depuración del error
                debugInfo.innerHTML = `
                    <strong>Error de conexión:</strong><br>
                    <pre>${error.toString()}</pre>
                `;
                debugInfo.style.display = 'block';
            }
        });
    </script>
</body>
</html>
